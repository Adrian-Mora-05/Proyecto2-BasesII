apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: restaurantes
  labels:
    app: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.18
          ports:
            - containerPort: 7474   # HTTP Browser
              name: http
            - containerPort: 7687   # Bolt protocol
              name: bolt
          env:
            - name: NEO4J_AUTH
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: NEO4J_AUTH
            - name: NEO4J_PLUGINS
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: NEO4J_PLUGINS
            - name: NEO4J_dbms_security_procedures_unrestricted
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: NEO4J_dbms_security_procedures_unrestricted
            - name: NEO4J_dbms_security_procedures_allowlist
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: NEO4J_dbms_security_procedures_allowlist
            - name: NEO4J_apoc_export_file_enabled
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: NEO4J_apoc_export_file_enabled
            - name: NEO4J_apoc_import_file_enabled
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: NEO4J_apoc_import_file_enabled
            - name: NEO4J_apoc_import_file_use__neo4j__config
              valueFrom:
                configMapKeyRef:
                  name: neo4j-config
                  key: NEO4J_apoc_import_file_use__neo4j__config
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs
            - name: neo4j-plugins
              mountPath: /plugins
            - name: neo4j-import
              mountPath: /var/lib/neo4j/import
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-data-pvc
        - name: neo4j-logs
          persistentVolumeClaim:
            claimName: neo4j-logs-pvc
        - name: neo4j-plugins
          persistentVolumeClaim:
            claimName: neo4j-plugins-pvc
        - name: neo4j-import
          configMap:
            name: neo4j-config
            items:
              - key: ubicaciones.cypher
                path: ubicaciones.cypher
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  namespace: restaurantes
  labels:
    app: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP