# ============================================================
#  docker-compose.analytics.yml
#  Stack de Analytics — Etapa 3
#  Proyecto: Reserva Inteligente de Restaurantes
#
#  Servicios:
#    - Hive Metastore (PostgreSQL)
#    - Hive Server2
#    - Apache Spark (master + worker)
#    - Apache Airflow (scheduler + webserver)
#    - Apache Superset
#
#  Uso:
#    docker-compose -f docker-compose.analytics.yml up -d
#
#  Prerequisito: la red "restaurant_net" debe existir.
#  Si levantás el stack principal primero, ya existe.
#  Si no: docker network create restaurant_net
# ============================================================

version: "3.9"

networks:
  restaurant_net:
    external: true          # comparte red con el stack principal (API, Mongo, Postgres)

volumes:
  hive_metastore_data:      # datos del PostgreSQL interno de Hive Metastore
  hive_warehouse_data:      # archivos ORC del warehouse
  airflow_db_data:          # SQLite / Postgres de Airflow
  airflow_logs:
  superset_data:

# ------------------------------------------------------------
#  Variables de entorno comunes para Airflow
# ------------------------------------------------------------
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    # Variables que el DAG lee para saber qué extractor usar
    DB_ENGINE: ${DB_ENGINE:-postgres}

    # PostgreSQL OLTP (si DB_ENGINE=postgres)
    DB_HOST:     ${DB_HOST:-postgres}
    DB_PORT:     ${DB_PORT:-5432}
    DB_USER:     ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    DB_NAME:     ${DB_NAME:-restaurantdb}

    # MongoDB OLTP (si DB_ENGINE=mongo)
    MONGO_URL: ${MONGO_URL:-mongodb://mongos-service:27017}
    MONGO_DB:  ${MONGO_DB:-restaurantdb}

    # Hive
    HIVE_HOST: hive-server
    HIVE_PORT: "10000"
    HIVE_DB:   restaurant_dw

    # Spark
    SPARK_MASTER_URL: spark://spark-master:7077

  volumes:
    - ./analytics/airflow/dags:/opt/airflow/dags
    - ./analytics/airflow/plugins:/opt/airflow/plugins
    - ./analytics/spark/jobs:/opt/airflow/spark_jobs   # jobs accesibles desde el DAG
    - airflow_logs:/opt/airflow/logs
  networks:
    - restaurant_net
  depends_on:
    airflow-db:
      condition: service_healthy

services:

  # ----------------------------------------------------------
  #  Hive Metastore Database (PostgreSQL dedicado)
  #  NO es el mismo Postgres del OLTP — es interno de Hive.
  # ----------------------------------------------------------
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB:       metastore
      POSTGRES_USER:     hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
    networks:
      - restaurant_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  Hive Metastore
  # ----------------------------------------------------------
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      SERVICE_NAME:         metastore
      DB_DRIVER:            postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - hive_warehouse_data:/opt/hive/data/warehouse
    ports:
      - "9083:9083"
    networks:
      - restaurant_net
    depends_on:
      hive-metastore-db:
        condition: service_healthy

  # ----------------------------------------------------------
  #  Hive Server2
  #  Expone el endpoint Thrift que PyHive y Beeline usan.
  # ----------------------------------------------------------
  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
      IS_RESUME: "true"
    volumes:
      - hive_warehouse_data:/opt/hive/data/warehouse
      - ./analytics/hive/ddl:/hive-init               # montamos los .hql para init
    ports:
      - "10000:10000"   # Thrift (PyHive, beeline)
      - "10002:10002"   # Web UI de HiveServer2
    networks:
      - restaurant_net
    depends_on:
      - hive-metastore
    healthcheck:
      test: ["CMD-SHELL", "beeline -u 'jdbc:hive2://localhost:10000' -e 'SHOW DATABASES;' 2>&1 | grep -q 'default'"]
      interval: 30s
      timeout: 20s
      retries: 10

  # ----------------------------------------------------------
  #  Hive Init — corre los .hql una sola vez al levantar
  # ----------------------------------------------------------
  hive-init:
    image: apache/hive:4.0.0
    container_name: hive-init
    entrypoint: >
      /bin/bash -c "
        echo 'Esperando HiveServer2...';
        sleep 30;
        beeline -u 'jdbc:hive2://hive-server:10000' -f /hive-init/01_star_schema.hql &&
        beeline -u 'jdbc:hive2://hive-server:10000' -f /hive-init/02_vistas_olap.hql &&
        echo 'Schema y vistas creados OK.';
      "
    volumes:
      - ./analytics/hive/ddl:/hive-init
    networks:
      - restaurant_net
    depends_on:
      hive-server:
        condition: service_healthy
    restart: "no"       # corre una vez y termina

  # ----------------------------------------------------------
  #  Spark Master
  # ----------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      SPARK_MODE:               master
      SPARK_MASTER_HOST:        spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED:     "no"
    ports:
      - "8080:8080"   # Spark Web UI
      - "7077:7077"   # Spark Master port
    networks:
      - restaurant_net
    volumes:
      - ./analytics/spark/jobs:/opt/spark-jobs

  # ----------------------------------------------------------
  #  Spark Worker
  #  Escalable: docker-compose up --scale spark-worker=3
  # ----------------------------------------------------------
  spark-worker:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE:        worker
      SPARK_MASTER_URL:  spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES:  2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED:     "no"
    networks:
      - restaurant_net
    volumes:
      - ./analytics/spark/jobs:/opt/spark-jobs
    depends_on:
      - spark-master

  # ----------------------------------------------------------
  #  Airflow — base de datos interna
  # ----------------------------------------------------------
  airflow-db:
    image: postgres:15-alpine
    container_name: airflow-db
    environment:
      POSTGRES_DB:       airflow
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - restaurant_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  Airflow Init — crea tablas y usuario admin
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: >
      /bin/bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@restaurant.local || true
      "
    restart: "no"

  # ----------------------------------------------------------
  #  Airflow Webserver  →  http://localhost:8090
  # ----------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  #  Airflow Scheduler
  # ----------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  #  Apache Superset  →  http://localhost:8088
  #  Usuario por defecto: admin / admin
  # ----------------------------------------------------------
  superset:
    image: apache/superset:3.1.0
    container_name: superset
    environment:
      SUPERSET_SECRET_KEY: "restaurant_superset_secret_change_me"
      SUPERSET_LOAD_EXAMPLES: "no"
    ports:
      - "8088:8088"
    networks:
      - restaurant_net
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      - hive-server
    command: >
      /bin/bash -c "
        pip install pyhive thrift thrift-sasl &&
        superset db upgrade &&
        superset fab create-admin
          --username admin --firstname Admin --lastname User
          --email admin@superset.local --password admin || true &&
        superset init &&
        superset run -p 8088 --with-threads --reload --debugger
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5