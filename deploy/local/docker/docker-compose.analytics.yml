# ============================================================
#  docker-compose.analytics.yml
#  Stack de Analytics — Etapa 3
#  Proyecto: Reserva Inteligente de Restaurantes
#
#  Ubicación: deploy/local/docker/docker-compose.analytics.yml
#
#  Prerequisito: el stack principal debe estar corriendo.
#    cd deploy/local/docker
#    docker-compose up -d
#
#  Luego levantar este stack:
#    docker-compose -f docker-compose.analytics.yml up -d
#
#  La red "docker_default" es creada automáticamente por
#  docker-compose.yml al estar en la carpeta "docker/".
#  Este stack se une a ella para poder alcanzar db_api,
#  mongo1/2/3, redis, etc. sin exponer puertos extra.
# ============================================================

version: "3.9"

networks:
  proyecto2_network:
    external: true
    name: proyecto2-basesii_default

volumes:
  hive_metastore_data:
  hive_warehouse_data:
  airflow_db_data:
  airflow_logs:
  superset_data:

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    DB_ENGINE: ${DB_ENGINE:-postgres}

    # PostgreSQL OLTP — mismo nombre de contenedor que docker-compose.yml
    DB_HOST:     ${DB_HOST:-db_api}
    DB_PORT:     ${DB_PORT:-5432}
    DB_USER:     ${POSTGRES_USER:-postgres}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    DB_NAME:     ${RESTAURANT_DB:-restaurantdb}

    # MongoDB OLTP — replica set del stack principal
    MONGO_URL: ${MONGO_URL:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0}
    MONGO_DB:  ${MONGO_DB:-restaurantdb}

    # Hive
    HIVE_HOST: hive-server
    HIVE_PORT: "10000"
    HIVE_DB:   restaurant_dw

    # Spark
    SPARK_MASTER_URL: spark://spark-master:7077

  volumes:
    - ../../../analytics/airflow/dags:/opt/airflow/dags
    - ../../../analytics/airflow/plugins:/opt/airflow/plugins
    - ../../../analytics/spark/jobs:/opt/airflow/spark_jobs
    - ../../../analytics/hive/etl:/opt/airflow/etl
    - airflow_logs:/opt/airflow/logs
  networks:
    - proyecto2_network
  depends_on:
    airflow-db:
      condition: service_healthy

services:

  # ----------------------------------------------------------
  #  Hive Metastore DB — Postgres INTERNO de Hive
  #  Distinto del db_api del stack principal
  # ----------------------------------------------------------
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB:       metastore
      POSTGRES_USER:     hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
    networks:
      - proyecto2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  Hive Metastore
  # ----------------------------------------------------------
  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER:    postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - hive_warehouse_data:/opt/hive/data/warehouse
    ports:
      - "9083:9083"
    networks:
      - proyecto2_network
    depends_on:
      hive-metastore-db:
        condition: service_healthy

  # ----------------------------------------------------------
  #  Hive Server2  →  Thrift :10000, Web UI :10002
  # ----------------------------------------------------------
  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
      IS_RESUME: "true"
    volumes:
      - hive_warehouse_data:/opt/hive/data/warehouse
      - ../../../analytics/hive/ddl:/hive-init
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - proyecto2_network
    depends_on:
      - hive-metastore
    healthcheck:
      test: ["CMD-SHELL", "beeline -u 'jdbc:hive2://localhost:10000' -e 'SHOW DATABASES;' 2>&1 | grep -q 'default'"]
      interval: 30s
      timeout: 20s
      retries: 10

  # ----------------------------------------------------------
  #  Hive Init — ejecuta los .hql UNA sola vez al levantar
  # ----------------------------------------------------------
  hive-init:
    image: apache/hive:4.0.0
    container_name: hive-init
    entrypoint: >
      /bin/bash -c "
        echo 'Esperando HiveServer2...';
        sleep 40;
        beeline -u 'jdbc:hive2://hive-server:10000' -f /hive-init/01_star_schema.hql &&
        beeline -u 'jdbc:hive2://hive-server:10000' -f /hive-init/02_vistas_olap.hql &&
        echo 'Schema y vistas creados correctamente.'
      "
    volumes:
      - ../../../analytics/hive/ddl:/hive-init
    networks:
      - proyecto2_network
    depends_on:
      hive-server:
        condition: service_healthy
    restart: "no"

  # ----------------------------------------------------------
  #  Spark Master  →  Web UI :8081  (8080 = Keycloak)
  # ----------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      SPARK_MODE:        master
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED:     "no"
    ports:
      - "8081:8080"
      - "7077:7077"
    networks:
      - proyecto2_network
    volumes:
      - ../../../analytics/spark/jobs:/opt/spark-jobs

  # ----------------------------------------------------------
  #  Spark Worker — escalable:
  #  docker-compose -f docker-compose.analytics.yml up --scale spark-worker=3 -d
  # ----------------------------------------------------------
  spark-worker:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE:          worker
      SPARK_MASTER_URL:    spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES:  2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED:     "no"
    networks:
      - proyecto2_network
    volumes:
      - ../../../analytics/spark/jobs:/opt/spark-jobs
    depends_on:
      - spark-master

  # ----------------------------------------------------------
  #  Airflow DB — Postgres INTERNO de Airflow
  # ----------------------------------------------------------
  airflow-db:
    image: postgres:15-alpine
    container_name: airflow-db
    environment:
      POSTGRES_DB:       airflow
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - proyecto2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  Airflow Init — instala deps, migra DB, crea admin
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: >
      /bin/bash -c "
        pip install pyhive thrift thrift-sasl psycopg2-binary pymongo apache-airflow-providers-apache-spark &&
        airflow db migrate &&
        airflow users create
          --username admin --password admin
          --firstname Admin --lastname User
          --role Admin --email admin@restaurant.local || true
      "
    restart: "no"

  # ----------------------------------------------------------
  #  Airflow Webserver  →  http://localhost:8090
  #  usuario: admin / admin
  # ----------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  #  Airflow Scheduler
  # ----------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ----------------------------------------------------------
  #  Apache Superset  →  http://localhost:8088
  #  usuario: admin / admin
  # ----------------------------------------------------------
  superset:
    image: apache/superset:3.1.0
    container_name: superset
    environment:
      SUPERSET_SECRET_KEY: "restaurant_superset_secret_change_me"
      SUPERSET_LOAD_EXAMPLES: "no"
    ports:
      - "8089:8088"
    networks:
      - proyecto2_network
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      - hive-server
    command: >
      /bin/bash -c "
        pip install pyhive thrift thrift-sasl &&
        superset db upgrade &&
        superset fab create-admin
          --username admin --firstname Admin --lastname User
          --email admin@superset.local --password admin || true &&
        superset init &&
        superset run -p 8088 --with-threads --reload --debugger
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5