# ============================================================
#  docker-compose.analytics.yml — Etapa 3
#  Ubicación: deploy/local/docker/docker-compose.analytics.yml
# ============================================================

networks:
  proyecto2_network:
    external: true
    name: proyecto2-basesii_default

volumes:
  hive_metastore_data:
  hive_warehouse_data:
  airflow_db_data:
  airflow_logs:
  superset_data:

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    DB_ENGINE:        ${DB_ENGINE:-postgres}
    DB_HOST:          ${DB_HOST:-db_api}
    DB_PORT:          ${DB_PORT:-5432}
    DB_USER:          ${POSTGRES_USER:-postgres}
    DB_PASSWORD:      ${POSTGRES_PASSWORD:-postgres}
    DB_NAME:          ${RESTAURANT_DB:-restaurantdb}
    MONGO_URL:        ${MONGO_URL:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0}
    MONGO_DB:         ${MONGO_DB:-restaurantdb}
    HIVE_HOST:        hive-server
    HIVE_PORT:        "10000"
    HIVE_DB:          restaurant_dw
    SPARK_MASTER_URL: spark://spark-master:7077
  volumes:
    - ${PWD}/analytics/airflow/dags:/opt/airflow/dags
    - ${PWD}/analytics/airflow/plugins:/opt/airflow/plugins
    - ${PWD}/analytics/spark/jobs:/opt/airflow/spark_jobs
    - ${PWD}/analytics/hive/etl:/opt/airflow/etl
    - airflow_logs:/opt/airflow/logs
  networks:
    - proyecto2_network
  depends_on:
    airflow-db:
      condition: service_healthy

services:

  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB:       metastore
      POSTGRES_USER:     hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
    networks:
      - proyecto2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    entrypoint: ["/bin/bash", "/hive-scripts/init-metastore.sh"]
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER:    postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - hive_warehouse_data:/opt/hive/data/warehouse
      - ${PWD}/analytics/hive/scripts:/hive-scripts
    networks:
      - proyecto2_network
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'metastore' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    entrypoint: ["/bin/bash", "/hive-scripts/init-hiveserver.sh"]
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
      IS_RESUME: "true"
    volumes:
      - hive_warehouse_data:/opt/hive/data/warehouse
      - ${PWD}/analytics/hive/ddl:/hive-init
      - ${PWD}/analytics/hive/scripts:/hive-scripts
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - proyecto2_network
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'hiveserver2\\|HiveServer2' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 120s

  hive-init:
    image: apache/hive:4.0.0
    container_name: hive-init
    entrypoint: >
      /bin/bash -c "
        echo 'Esperando HiveServer2...';
        sleep 30;
        beeline -u 'jdbc:hive2://hive-server:10000' -f /hive-init/01_star_schema.hql &&
        beeline -u 'jdbc:hive2://hive-server:10000' -f /hive-init/02_vistas_olap.hql &&
        echo '=== Schema y vistas creados correctamente ==='
      "
    volumes:
      - ${PWD}/analytics/hive/ddl:/hive-init
    networks:
      - proyecto2_network
    depends_on:
      hive-server:
        condition: service_healthy
    restart: "no"

  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8081:8080"
      - "7077:7077"
    networks:
      - proyecto2_network
    volumes:
      - ${PWD}/analytics/spark/jobs:/opt/spark-jobs

  spark-worker:
    image: apache/spark:3.5.6
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES:  "2"
    networks:
      - proyecto2_network
    volumes:
      - ${PWD}/analytics/spark/jobs:/opt/spark-jobs
    depends_on:
      - spark-master

  airflow-db:
    image: postgres:15-alpine
    container_name: airflow-db
    environment:
      POSTGRES_DB:       airflow
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - proyecto2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  #  Airflow Init
  #  CRÍTICO: instalar con versiones fijas para no sobreescribir
  #  el Airflow 2.9.1 de la imagen base.
  # ----------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: ["/bin/bash", "/airflow-scripts/airflow-init.sh"]
    volumes:
      - ${PWD}/analytics/airflow/dags:/opt/airflow/dags
      - ${PWD}/analytics/airflow/plugins:/opt/airflow/plugins
      - ${PWD}/analytics/spark/jobs:/opt/airflow/spark_jobs
      - ${PWD}/analytics/hive/etl:/opt/airflow/etl
      - ${PWD}/analytics/airflow/scripts:/airflow-scripts
      - airflow_logs:/opt/airflow/logs
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset:
    image: apache/superset:3.1.0
    container_name: superset
    environment:
      SUPERSET_SECRET_KEY: "restaurant_superset_secret_change_me"
      SUPERSET_LOAD_EXAMPLES: "no"
    ports:
      - "8089:8088"
    networks:
      - proyecto2_network
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      hive-server:
        condition: service_healthy
    command: >
      /bin/bash -c "
        pip install --quiet pyhive thrift thrift-sasl &&
        superset db upgrade &&
        superset fab create-admin
          --username admin --firstname Admin --lastname User
          --email admin@superset.local --password admin || true &&
        superset init &&
        superset run -p 8088 --with-threads --reload --debugger
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5