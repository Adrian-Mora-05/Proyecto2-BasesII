services:

  configsvr1:
    image: mongo:7
    container_name: configsvr1
    command: mongod --configsvr --replSet configReplSet --bind_ip_all --port 27017
    volumes:
      - configsvr1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  configsvr2:
    image: mongo:7
    container_name: configsvr2
    command: mongod --configsvr --replSet configReplSet --bind_ip_all --port 27017
    volumes:
      - configsvr2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  configsvr3:
    image: mongo:7
    container_name: configsvr3
    command: mongod --configsvr --replSet configReplSet --bind_ip_all --port 27017
    volumes:
      - configsvr3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  shard1-primary:
    image: mongo:7
    container_name: shard1-primary
    command: mongod --shardsvr --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - shard1_primary_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  shard1-secondary1:
    image: mongo:7
    container_name: shard1-secondary1
    command: mongod --shardsvr --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - shard1_secondary1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s


  shard1-secondary2:
    image: mongo:7
    container_name: shard1-secondary2
    command: mongod --shardsvr --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - shard1_secondary2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s


  mongo-init:
    image: mongo:7
    container_name: mongo-init
    depends_on:
      configsvr1:
        condition: service_healthy
      configsvr2:
        condition: service_healthy
      configsvr3:
        condition: service_healthy
      shard1-primary:
        condition: service_healthy
      shard1-secondary1:
        condition: service_healthy
      shard1-secondary2:
        condition: service_healthy
    entrypoint: >
      bash -c "
        set -e

        echo '=== 1. Inicializando Config Server Replica Set ===' &&
        mongosh --host configsvr1:27017 --eval '
          try {
            rs.initiate({
              _id: \"configReplSet\",
              configsvr: true,
              members: [
                { _id: 0, host: \"configsvr1:27017\" },
                { _id: 1, host: \"configsvr2:27017\" },
                { _id: 2, host: \"configsvr3:27017\" }
              ]
            });
          } catch(e) {
            if (e.codeName === \"AlreadyInitialized\") {
              print(\"Config RS ya inicializado, continuando...\");
            } else { throw e; }
          }
        ' &&
        sleep 5 &&

        echo '=== 2. Inicializando Shard rs0 ===' &&
        mongosh --host shard1-primary:27017 --eval '
          try {
            rs.initiate({
              _id: \"rs0\",
              members: [
                { _id: 0, host: \"shard1-primary:27017\",    priority: 2 },
                { _id: 1, host: \"shard1-secondary1:27017\", priority: 1 },
                { _id: 2, host: \"shard1-secondary2:27017\", priority: 1 }
              ]
            });
          } catch(e) {
            if (e.codeName === \"AlreadyInitialized\") {
              print(\"Shard RS ya inicializado, continuando...\");
            } else { throw e; }
          }
        ' &&
        sleep 10 &&

        echo '=== 3. Iniciando mongos temporalmente ===' &&
        mongos --configdb configReplSet/configsvr1:27017,configsvr2:27017,configsvr3:27017 --port 27020 --fork --logpath /tmp/mongos.log &&
        sleep 5 &&

        echo '=== 4. Registrando el shard ===' &&
        mongosh --port 27020 --eval '
          try {
            sh.addShard(\"rs0/shard1-primary:27017,shard1-secondary1:27017,shard1-secondary2:27017\");
          } catch(e) {
            if (e.code === 23 || e.codeName === \"ShardAlreadyExists\") {
              print(\"Shard ya registrado, continuando...\");
            } else { throw e; }
          }
        ' &&

        echo '=== 5. Habilitando sharding ===' &&
        mongosh --port 27020 --eval '
          try {
            sh.enableSharding(\"restaurantdb\");
          } catch(e) {
            if (e.codeName === \"AlreadyInitialized\" || e.code === 23) {
              print(\"Sharding ya habilitado, continuando...\");
            } else { throw e; }
          }
        ' &&

        echo '=== 6. Configurando shard keys ===' &&
        mongosh --port 27020 --eval '
          try {
            sh.shardCollection(\"restaurantdb.pedidos\", { id_restaurante: \"hashed\" });
          } catch(e) { print(\"pedidos: \" + e.message); }
          try {
            sh.shardCollection(\"restaurantdb.reservaciones\", { id_restaurante: \"hashed\" });
          } catch(e) { print(\"reservaciones: \" + e.message); }
          try {
            db.getSiblingDB(\"restaurantdb\").pedidos.createIndex({ id_restaurante: 1, createdAt: -1 });
            db.getSiblingDB(\"restaurantdb\").reservaciones.createIndex({ id_restaurante: 1, fecha: 1 });
            db.getSiblingDB(\"restaurantdb\").menus.createIndex({ id_restaurante: 1 });
          } catch(e) { print(\"Indices: \" + e.message); }
          print(\"Sharding configurado correctamente\");
        ' &&

        echo '=== mongo-init completado ==='
      "
    restart: "no"

  mongos:
    image: mongo:7
    container_name: mongos
    command: >
      mongos
      --configdb configReplSet/configsvr1:27017,configsvr2:27017,configsvr3:27017
      --bind_ip_all
      --port 27017
    ports:
      - "27017:27017"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_IMPORT: ${KC_IMPORT:-/opt/keycloak/data/import/realm-export.json}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8080}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-"false"}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/local/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/realms/master || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s

  api:
    build: ./api
    depends_on:
      mongos:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DB_ENGINE: ${DB_ENGINE:-mongodb}
      MONGO_URL: ${MONGO_URL:-mongodb://mongos:27017/}
      MONGO_DB: ${MONGO_DB:-restaurantdb}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      REALM: ${REALM:-restaurant}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-api-restaurant}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-api-restaurant-secret}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

  search:
    build: ./search-service
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ELASTIC_URL: ${ELASTIC_URL:-http://elasticsearch:9200}
      DB_ENGINE: ${DB_ENGINE:-mongodb}
      MONGO_URL: ${MONGO_URL:-mongodb://mongos:27017/}
      MONGO_DB: ${MONGO_DB:-restaurantdb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

  nginx:
    image: nginx:alpine
    depends_on:
      - api
      - search
    ports:
      - "80:80"
    volumes:
      - ./deploy/local/nginx/nginx.mongo.conf:/etc/nginx/nginx.conf:ro

volumes:
  configsvr1_data:
  configsvr2_data:
  configsvr3_data:
  shard1_primary_data:
  shard1_secondary1_data:
  shard1_secondary2_data:
  redis_data:
  es_data:
