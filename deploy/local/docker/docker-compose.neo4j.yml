# docker-compose.neo4j.yml
# Stack de Neo4J para análisis de grafos — Proyecto 2
#
# ── Orden de uso ──────────────────────────────────────────────────
# 1. Primero levantar el Proyecto 1:
#      docker compose -f deploy/local/docker/docker-compose.postgres.yml --project-directory . up -d
#
# 2. Levantar Neo4J:
#      docker compose -f deploy/local/docker/docker-compose.neo4j.yml --project-directory . up -d neo4j
#
# 3. Esperar ~60 segundos a que Neo4J cargue los plugins
#
# 4. Cargar ubicaciones fijas (solo la primera vez):
#      docker compose -f deploy/local/docker/docker-compose.neo4j.yml --project-directory . exec neo4j cypher-shell -u neo4j -p password123 -f /var/lib/neo4j/import/ubicaciones.cypher
#
# 5. Migrar datos de PG/Mongo a Neo4J:
#      docker compose -f deploy/local/docker/docker-compose.neo4j.yml --project-directory . run neo4j-migrate
#
# 6. Abrir Neo4J Browser: http://localhost:7474
#
# ── Para apagar ───────────────────────────────────────────────────
#      docker compose -f deploy/local/docker/docker-compose.neo4j.yml --project-directory . down

services:

  # ════════════════════════════════════════════════════════════════
  #  NEO4J — Base de datos de grafos
  # ════════════════════════════════════════════════════════════════
  neo4j:
    image: neo4j:5.18
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      # Archivos Cypher de seed — neo4j/ estará en la raíz del proyecto
      - ./neo4j/seed:/var/lib/neo4j/import
    networks:
      - neo4j_network
      - proyecto1_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════
  #  NEO4J-MIGRATE — Script que carga datos al grafo
  # ════════════════════════════════════════════════════════════════
  neo4j-migrate:
    build:
      # neo4j/ estará en la raíz del proyecto
      context: ./neo4j
      dockerfile: Dockerfile
    container_name: neo4j-migrate
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      DB_ENGINE: ${DB_ENGINE:-postgres}
      PG_HOST: ${DB_HOST:-db_api}
      PG_PORT: ${DB_PORT:-5432}
      PG_USER: ${POSTGRES_USER:-admin}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      PG_DB: ${RESTAURANT_DB:-restaurantdb}
      MONGO_URL: ${MONGO_URL:-mongodb://mongos:27017/}
      MONGO_DB: ${MONGO_DB:-restaurantdb}
    networks:
      - neo4j_network
      - proyecto1_network
    restart: "no"

# ══════════════════════════════════════════════════════════════════
#  REDES
# ══════════════════════════════════════════════════════════════════
networks:
  neo4j_network:
    driver: bridge

  # Red creada por el docker-compose del Proyecto 1
  # Verificar nombre exacto con: docker network ls
  # Normalmente: {nombre_carpeta}_default
  proyecto1_network:
    external: true
    name: ${PROYECTO1_NETWORK:-proyecto2-basesii_default}

# ══════════════════════════════════════════════════════════════════
#  VOLÚMENES
# ══════════════════════════════════════════════════════════════════
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins: